<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>On Your Mark! Staff Blog Edit — ログイン</title>
  <meta name="robots" content="noindex" />

  <!-- Fonts（公開サイトと同じ） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">

  <main class="auth-card">
    <span class="brand__mark">
      <img src="images/logo.svg" alt="On Your Mark! ロゴ" />
    </span>

    <p class="auth-card__kicker">Staff only</p>
    <h1 class="auth-card__title">On Your Mark!<br />Staff Blog Edit</h1>
    <p class="auth-card__lead">記事の作成・編集はスタッフ専用です。<br />Googleアカウントでログインしてください。</p>

    <button class="btn-google" id="googleLoginBtn" type="button">
      <span class="btn-google__icon" aria-hidden="true">
        <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.98 10.72A5.4 5.4 0 0 1 3.7 9c0-.6.1-1.18.28-1.72V4.94H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.06l3.02-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
      </span>
      Googleでログイン
    </button>

    <p class="auth-card__msg" id="authMsg" role="status" aria-live="polite"></p>

    <a class="auth-card__back" href="../public-site/index.html">← 公開サイトへもどる</a>
  </main>

  <!-- ===== Scripts (external only) =====
       読み込み順: Firebase本体 → firebase-config.js → login.js
       すべて defer なので、記述順のまま順番に実行されます。 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>
