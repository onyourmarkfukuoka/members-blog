<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="edit.docTitle">On Your Mark! Staff Blog Edit — 編集</title>
  <meta name="robots" content="noindex" />

  <!-- Fonts（公開サイトと同じ） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ログイン確認が終わるまでは中身を隠しておく（ちらつき防止） -->
  <div class="auth-gate" id="authGate">
    <p data-i18n="gate.checking">ログイン状態を確認しています…</p>
  </div>

  <div class="admin-app" id="adminApp" hidden>

    <!-- ===== Header ===== -->
    <header class="admin-header">
      <a class="brand" href="index.html">
        <span class="brand__mark">
          <img src="images/logo.svg" alt="On Your Mark! ロゴ" />
        </span>
        <span class="brand__text">
          <span class="brand__en">On Your Mark!</span>
          <span class="brand__sub">Staff Blog Edit</span>
        </span>
      </a>

      <div class="admin-header__user">
        <div class="lang-toggle" role="group" data-i18n-aria-label="lang.group">
          <button type="button" class="lang-toggle__btn" data-lang-btn="ja" aria-pressed="true">JP</button>
          <button type="button" class="lang-toggle__btn" data-lang-btn="en" aria-pressed="false">EN</button>
        </div>
        <button class="btn-ghost" id="menuBtn" type="button" hidden data-i18n="header.menu">← メニュー</button>
        <span class="welcome" id="welcome"></span>
        <button class="btn-ghost" id="editNameBtn" type="button" aria-expanded="false" aria-controls="namePanel" data-i18n="header.changeName">表示名を変更</button>
        <button class="btn-ghost" id="logoutBtn" type="button" data-i18n="header.logout">ログアウト</button>
      </div>
    </header>

    <!-- ===== 表示名（ヘッダーのあいさつ／編集者名の初期値） ===== -->
    <p class="welcome-hint" id="welcomeHint" data-i18n="name.unsetHint" hidden></p>

    <div class="name-editor" id="namePanel" hidden>
      <div class="name-editor__inner">
        <label class="field__label" for="nameInput" data-i18n="name.label">表示名</label>
        <p class="name-editor__note" data-i18n="name.note">ヘッダーのあいさつに表示される名前です。新しい記事の「編集者名」の初期値にもなります（記事ごとに書き換え可）。</p>
        <div class="name-editor__row">
          <input class="field__input" type="text" id="nameInput" maxlength="40"
                 autocomplete="off" data-i18n-placeholder="name.placeholder" placeholder="ヘッダーに表示する名前" />
          <div class="name-editor__actions">
            <button class="btn btn--primary" type="button" id="nameSaveBtn" data-i18n="name.save">保存</button>
            <button class="btn btn--ghost" type="button" id="nameCancelBtn" data-i18n="name.cancel">キャンセル</button>
          </div>
        </div>
        <p class="name-editor__status" id="nameStatus" role="status" aria-live="polite"></p>
      </div>
    </div>

    <main class="admin-main" id="adminMain">

      <!-- ===== 最初の選択画面 ===== -->
      <section class="home-choice" id="homeChoice" hidden>
        <h1 class="home-choice__title" id="homeChoiceTitle" data-i18n="choice.title">何をしますか？</h1>
        <div class="home-choice__grid">
          <button class="choice-card" id="chooseNew" type="button">
            <span class="choice-card__icon" aria-hidden="true">＋</span>
            <span class="choice-card__label" data-i18n="choice.newLabel">新しい記事を作成</span>
            <span class="choice-card__desc" data-i18n="choice.newDesc">白紙から記事を書きます</span>
          </button>
          <button class="choice-card" id="chooseEdit" type="button">
            <span class="choice-card__icon" aria-hidden="true">✎</span>
            <span class="choice-card__label" data-i18n="choice.editLabel">既存の記事を編集</span>
            <span class="choice-card__desc" data-i18n="choice.editDesc">自分が書いた記事を選んで直します</span>
          </button>
        </div>
      </section>

      <!-- ===== 編集フォーム ===== -->
      <section class="editor-panel" id="editorPanel" hidden>
        <div class="editor-panel__head">
          <h1 class="editor-panel__title" id="formTitle" data-i18n="form.newTitle">新しい記事</h1>
          <button class="btn-ghost" id="newPostBtn" type="button" data-i18n="form.new">＋ 新規作成</button>
        </div>

        <form class="post-form" id="postForm">
          <div class="field">
            <label class="field__label" for="fTitle" data-i18n="field.title">タイトル</label>
            <input class="field__input" type="text" id="fTitle" name="title"
                   data-i18n-placeholder="field.title.ph" placeholder="記事のタイトル" autocomplete="off" required />
          </div>

          <div class="field-row">
            <div class="field">
              <label class="field__label" for="fDate" data-i18n="field.date">日付</label>
              <input class="field__input" type="date" id="fDate" name="date" required />
            </div>
            <div class="field">
              <label class="field__label" for="fEditor" data-i18n="field.editor">編集者名</label>
              <input class="field__input" type="text" id="fEditor" name="editorName"
                     data-i18n-placeholder="field.editor.ph" placeholder="記事に表示する名前" autocomplete="off" required />
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="fCategory" data-i18n="field.category">カテゴリ</label>
            <select class="field__input field__input--select" id="fCategory" name="category" required>
              <option value="camp" data-i18n="cat.camp">キャンプ当日</option>
              <option value="meeting" data-i18n="cat.meeting">ミーティング</option>
              <option value="other" selected data-i18n="cat.other">その他</option>
            </select>
          </div>

          <div class="field">
            <span class="field__label" data-i18n="field.photos">写真（最大2枚）</span>
            <div class="photo-uploader" id="photoUploader">
              <ul class="photo-list" id="photoList"><!-- editor.js が入れます --></ul>
              <label class="photo-add" id="photoAddLabel">
                <input type="file" id="photoInput" accept="image/*" multiple hidden />
                <span data-i18n="photo.add">＋ 写真を追加</span>
              </label>
            </div>
            <p class="field__hint" id="photoHint" data-i18n="photo.hint">JPEG / PNG など。保存・公開したときにアップロードされます。</p>
          </div>

          <div class="field">
            <label class="field__label" for="fBody" data-i18n="field.body">本文</label>
            <textarea class="field__input field__input--area" id="fBody" name="body"
                      rows="14" data-i18n-placeholder="field.body.ph" placeholder="ここに本文を書きます。段落は空行で区切ってください。" required></textarea>
          </div>

          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>

          <div class="form-actions">
            <button class="btn btn--ghost" type="button" id="saveDraftBtn" data-i18n="form.saveDraft">一時保存</button>
            <button class="btn btn--primary" type="button" id="publishBtn" data-i18n="form.publish">公開</button>
          </div>
          <p class="form-hint" id="editingHint" hidden></p>
        </form>
      </section>

      <!-- ===== 記事一覧（自分が書いた記事） ===== -->
      <section class="list-panel" id="listPanel" hidden>
        <h2 class="list-panel__title" data-i18n="list.title">自分が書いた記事</h2>
        <p class="list-panel__empty" id="listEmpty" data-i18n="list.empty" hidden>あなたが書いた記事はまだありません。</p>
        <ul class="post-list" id="postList"><!-- editor.js が入れます --></ul>
      </section>

    </main>
  </div>

  <!-- ===== Scripts (external only) =====
       読み込み順: Firebase本体 → firebase-config.js → editor.js
       すべて defer なので、記述順のまま順番に実行されます。 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/editor.js" defer></script>
</body>
</html>
